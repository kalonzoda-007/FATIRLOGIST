name: Publish FATIR Telegram migration preview (separate path)
on:
  push:
    branches:
      - migration/telegram-cloudflare-20261105
    paths:
      - 'migration/fatir-miniapp/**'
      - '.github/workflows/deploy-fatir-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
      - name: Checkout actual GitHub Pages branch (preserve all original files)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build staging React app
        working-directory: source/migration/fatir-miniapp
        env:
          VITE_API_BASE_URL: https://fatir-miniapp-migration.kalonzoda007.workers.dev
        run: |
          npm install
          npm run build
          npx tsc --noEmit
      - name: Publish preview without overwriting existing Pages root
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A concurrent Pages commit may change gh-pages while this build runs.
          # Refresh from the latest branch and replace ONLY the staging folder.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            mkdir -p migration-preview
            rm -rf migration-preview/assets
            cp -a ../source/migration/fatir-miniapp/dist/. migration-preview/
            test -f migration-preview/index.html
            test -d migration-preview/assets
            git add migration-preview/
            if git diff --cached --quiet; then
              echo "Preview already up to date"
              exit 0
            fi
            git commit -m "Publish independent FATIR Telegram staging preview"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Concurrent Pages update; retrying..."
            sleep 2
          done
          echo "Failed to publish preview after retries" >&2
          exit 1
