name: Validate FATIR migration (no deployment)
on:
  pull_request:
    paths:
      - 'migration/fatir-miniapp/**'
      - '.github/workflows/validate-fatir-migration.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/fatir-miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx tsc --noEmit
      - run: node --check worker/src/index.js
      - run: node --test worker/tests/*.test.js
