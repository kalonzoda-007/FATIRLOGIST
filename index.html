<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ФАТИР — Вход</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#0b1220;color:#eef4ff;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 32px));background:#121c2e;border:1px solid #263650;border-radius:24px;padding:30px;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px;font-size:32px}p{color:#9fb0c8}.field{margin:18px 0}.field label{display:block;margin-bottom:7px}.field input{box-sizing:border-box;width:100%;padding:13px;border-radius:12px;border:1px solid #344761;background:#0c1525;color:white;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:12px;background:#4f8cff;color:white;font-weight:700;font-size:16px;cursor:pointer}.err{color:#ff8f8f;min-height:22px}.note{font-size:12px;color:#7f91aa;margin-top:18px;line-height:1.5}</style></head><body><main class="card"><h1>ФАТИР</h1><p>Демонстрационная система управления заказами</p><div class="field"><label>Логин</label><input id="u" autocomplete="username"></div><div class="field"><label>Пароль</label><input id="p" type="password" autocomplete="current-password"></div><div class="err" id="e"></div><button onclick="login()">Войти</button><div class="note">Демо-вход: astra007 / astra777. Для реальной эксплуатации авторизацию необходимо перенести на сервер.</div></main><script>function login(){if(u.value==='astra007'&&p.value==='astra777'){sessionStorage.setItem('fatir_demo_auth','1');location.href='/FATIRLOGIST.html'}else e.textContent='Неверный логин или пароль'}</script></body></html>
